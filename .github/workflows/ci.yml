name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate` (postinstall) and `next build` resolve
      # their env reads. CI never connects to a database — it only compiles.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      SESSION_SECRET: "ci-placeholder-secret-not-used-for-anything-real"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
